  <text x="248" y="150" font-size="66" font-weight="700" fill="#f8fafc">synaptic<tspan fill="#5eead4">-core</tspan></text>
  <text x="252" y="196" font-size="27" font-weight="700" fill="#5eead4">One brain. Any agent. Zero install.</text>
  <text x="252" y="232" font-size="19" fill="#aeb8da">A portable knowledge-graph brain for project work:</text>
  <text x="252" y="258" font-size="19" fill="#aeb8da">it turns daily work into structured, navigable, agent-usable knowledge.</text>

