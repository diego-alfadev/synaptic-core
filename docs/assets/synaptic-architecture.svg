<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="560" viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="560" rx="16" fill="#ffffff"/>
  <rect x="1" y="1" width="998" height="558" rx="16" fill="none" stroke="#e2e8f0" stroke-width="2"/>

  <g font-size="14">
    <rect x="28" y="24" width="13" height="13" rx="3" fill="#dcfce7" stroke="#16a34a"/><text x="48" y="35" fill="#334155">boot</text>
    <rect x="110" y="24" width="13" height="13" rx="3" fill="#dbeafe" stroke="#2563eb"/><text x="130" y="35" fill="#334155">wiki - what you know</text>
    <rect x="320" y="24" width="13" height="13" rx="3" fill="#fef3c7" stroke="#d97706"/><text x="340" y="35" fill="#334155">harness - how you work</text>
    <rect x="560" y="24" width="13" height="13" rx="3" fill="#f1f5f9" stroke="#64748b"/><text x="580" y="35" fill="#334155">working memory</text>
  </g>

  <g font-size="17" font-weight="700">
    <rect x="60" y="70" width="300" height="58" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="210" y="95" text-anchor="middle" fill="#14532d">BRAIN.md</text>
    <text x="210" y="116" text-anchor="middle" font-size="13" font-weight="400" fill="#3f6212">the only file read at session start</text>

    <rect x="60" y="166" width="300" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="210" y="191" text-anchor="middle" fill="#1e3a8a">knowledge/INDEX.md</text>
    <text x="210" y="212" text-anchor="middle" font-size="13" font-weight="400" fill="#1d4ed8">hub map-of-content / the 7 clusters</text>

    <rect x="60" y="262" width="300" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="210" y="287" text-anchor="middle" fill="#1e3a8a">{cluster}/_index.md</text>
    <text x="210" y="308" text-anchor="middle" font-size="13" font-weight="400" fill="#1d4ed8">sub-map / one line per node</text>

    <rect x="60" y="358" width="300" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="210" y="383" text-anchor="middle" fill="#1e3a8a">node.md (the 1-2 you need)</text>
    <text x="210" y="404" text-anchor="middle" font-size="13" font-weight="400" fill="#1d4ed8">atomic / linked with [[wikilinks]]</text>
  </g>

  <g fill="#2563eb">
    <rect x="208.5" y="128" width="3" height="32"/><polygon points="205,160 215,160 210,166"/>
    <rect x="208.5" y="224" width="3" height="32"/><polygon points="205,256 215,256 210,262"/>
    <rect x="208.5" y="320" width="3" height="32"/><polygon points="205,352 215,352 210,358"/>
  </g>
  <text x="210" y="444" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">bounded navigation - a median 4 reads to any insight (internal benchmark)</text>

  <text x="440" y="60" font-size="14" font-weight="700" fill="#64748b">loaded on demand</text>
  <g font-size="16" font-weight="700">
    <rect x="440" y="166" width="500" height="54" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="464" y="190" fill="#1e3a8a">registries/</text>
    <text x="464" y="209" font-size="13" font-weight="400" fill="#1d4ed8">tabular lookups - resources, repos, glossary</text>

    <rect x="440" y="232" width="500" height="54" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="464" y="256" fill="#1e3a8a">references/</text>
    <text x="464" y="275" font-size="13" font-weight="400" fill="#1d4ed8">existence index + raw/ verbatim drop-zone</text>

    <rect x="440" y="298" width="500" height="54" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="464" y="322" fill="#78350f">harness/</text>
    <text x="464" y="341" font-size="13" font-weight="400" fill="#92400e">conventions / guardrails / skills - deployed, not loaded</text>

    <rect x="440" y="364" width="500" height="54" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="464" y="388" fill="#334155">journal/ + playgrounds/</text>
    <text x="464" y="407" font-size="13" font-weight="400" fill="#475569">thin working memory / burnable per-task workspaces</text>
  </g>

  <rect x="60" y="470" width="880" height="58" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="500" y="495" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">OUT of the brain - persona, tone, chat language</text>
  <text x="500" y="516" text-anchor="middle" font-size="13" fill="#64748b">live in your agent harness (AGENTS.md / CLAUDE.md), never inside the brain - your agent stays yours</text>
</svg>
